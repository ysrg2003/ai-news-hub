name: Daily Article Generation

on:
  schedule:
    # Run at 2 AM UTC daily (generates 16 articles)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Generate articles
        run: node scripts/daily-generate-articles.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Update Sitemap
        run: node scripts/update-sitemaps.mjs

      - name: Commit changes
        run: |
          git config user.name "Daily AI Hub Bot"
          git config user.email "bot@dailyaihub.com"
          git add -A
          git commit -m "chore: daily article generation and sitemap update" || true

      - name: Push changes
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send notification
        if: always()
        run: |
          echo "Daily article generation completed"
          echo "Status: ${{ job.status }}"
